name: Daily Shorts autopilot

# Every day: plan the next ~28 hours of slots for every channel, produce one video per slot in parallel,
# upload each as a scheduled (private -> public at the slot time) YouTube video and record it in
# state/history.json. Manual runs default to a DRY RUN (nothing is uploaded).

on:
  schedule:
    - cron: "23 3 * * *" # 03:23 UTC; an off-peak minute (GitHub delays jobs queued on the hour)
    # Second chance: if the morning run was skipped or failed, this one plans every slot still at least 3 hours away.
    # When the morning run worked it only prepares the next day's first slot early (nothing is ever produced twice).
    - cron: "23 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: produce the videos but do NOT upload them"
        type: boolean
        default: true
      channels:
        description: "Comma-separated channel ids (empty = all channels)"
        type: string
        default: ""
      lead_hours:
        description: "Only plan slots at least this many hours ahead (empty = 3). Use e.g. 1 to catch a slot that is close."
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: shorts-autopilot
  cancel-in-progress: false

env:
  # scheduled runs are always real; manual runs follow the checkbox
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  # Groq first: Gemini's free tier allows only 20 requests a day and is often overloaded. Gemini stays as the backup.
  LLM_PROVIDER: groq

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      errors: ${{ steps.plan.outputs.errors }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pydantic pydantic-settings typer anthropic httpx tzdata
      - name: Check the Gemini key (prints only the HTTP status and the quota detail, never the key)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "::error::Secret GEMINI_API_KEY is EMPTY"; exit 1; fi
          code=$(curl -s -o /tmp/gemini.json -w '%{http_code}' -H "x-goog-api-key: $GEMINI_API_KEY" -H 'Content-Type: application/json' \
            -d '{"contents":[{"parts":[{"text":"Say OK"}]}]}' \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent")
          echo "key length: ${#GEMINI_API_KEY} chars, HTTP status: $code"
          if [ "$code" != "200" ]; then
            msg=$(head -c 900 /tmp/gemini.json | tr '\n' ' ')
            echo "::error::Gemini key check HTTP $code: $msg"
          fi
      - name: Plan slots and topics
        id: plan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }} # optional free backup LLM
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # optional paid last resort
          CHANNELS: ${{ inputs.channels }}
          LEAD_HOURS: ${{ inputs.lead_hours }}
        run: |
          if [ -n "$LEAD_HOURS" ]; then export PLAN_LEAD_HOURS="$LEAD_HOURS"; fi
          python engine/daily.py plan --channels "$CHANNELS" --github-output
      - name: Tell Telegram what was planned
        if: always() && steps.plan.conclusion != 'skipped'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PLAN_MATRIX: ${{ steps.plan.outputs.matrix }}
          PLAN_ERRORS: ${{ steps.plan.outputs.errors }}
        run: python engine/telegram_bot.py notify-plan

  produce:
    needs: plan
    if: needs.plan.outputs.count != '' && needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false # one failing video must not stop the others
      max-parallel: 1 # one at a time: the free Gemini quota cannot take 3 videos at once
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Linux libraries for Remotion's headless Chrome
        run: >
          sudo apt-get update && sudo apt-get install -y
          libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3
          libxcomposite1 libxdamage1 libgbm-dev libcups2 libcairo2 libpango-1.0-0 libatk-bridge2.0-0
      - name: Cache the voice models (Kokoro ~350 MB, Whisper ~150 MB)
        uses: actions/cache@v4
        with:
          path: |
            models/kokoro
            ~/.cache/huggingface
          key: voice-models-kokoro-v1.0-whisper-base.en
      - name: Produce the video (retries, backup LLMs and a reserve script, so a slot is never left empty)
        env:
          # Edge TTS is blocked on GitHub's servers ("No audio was received"); Kokoro runs locally and is free.
          TTS_PROVIDER: kokoro
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }} # optional free backup LLM
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # optional paid last resort
          YOUTUBE_TOKENS_JSON: ${{ secrets.YOUTUBE_TOKENS_JSON }}
          # values from the planner go through the environment, never straight into the shell command
          CHANNEL: ${{ matrix.channel }}
          TOPIC: ${{ matrix.topic }}
          PUBLISH_AT: ${{ matrix.publish_at }}
          PLAN_ID: ${{ matrix.plan_id }}
          RESERVE: ${{ matrix.reserve }}
        run: |
          set -uo pipefail
          base=(--channel "$CHANNEL" --topic "$TOPIC" --publish-at "$PUBLISH_AT" --plan-id "$PLAN_ID" --render)
          if [ "$DRY_RUN" != "true" ]; then base+=(--upload); fi
          if [ -n "$RESERVE" ]; then base+=(--reserve-file "$RESERVE"); fi
          for attempt in 1 2 3; do
            args=("${base[@]}")
            last=$(ls -dt output/*/ 2>/dev/null | head -1 || true)
            # a retry continues the unfinished run folder (script, voice and timing are kept)
            if [ "$attempt" -gt 1 ] && [ -n "$last" ]; then args+=(--resume "${last%/}"); fi
            if python engine/pipeline.py "${args[@]}"; then exit 0; fi
            echo "::warning::Attempt $attempt of 3 failed for $PLAN_ID; retrying after a pause"
            sleep $((attempt * 150))
          done
          exit 1
      - name: Tell Telegram how this video went
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHANNEL: ${{ matrix.channel }}
          TOPIC: ${{ matrix.topic }}
          PUBLISH_AT: ${{ matrix.publish_at }}
          PLAN_ID: ${{ matrix.plan_id }}
          YOUTUBE_TOKENS_JSON: ${{ secrets.YOUTUBE_TOKENS_JSON }}
        run: python engine/telegram_bot.py notify-video
      - name: Keep the result for bookkeeping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.plan_id }}
          path: |
            output/*/result.json
            output/*/script.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Keep the video (dry runs only, so you can watch it)
        if: always() && env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.plan_id }}
          path: output/*/final.mp4
          retention-days: 3
          if-no-files-found: ignore

  record:
    needs: [plan, produce]
    if: >-
      always() && needs.plan.outputs.count != '' && needs.plan.outputs.count != '0' &&
      !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # commits state/history.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pydantic pydantic-settings typer anthropic httpx tzdata google-api-python-client google-auth google-auth-oauthlib
      - run: mkdir -p artifacts
      - uses: actions/download-artifact@v4
        continue-on-error: true # no artifacts at all when every video failed
        with:
          pattern: result-*
          path: artifacts
      - name: Update state/history.json
        run: python engine/daily.py record --results-dir artifacts
      - name: Post first comments that did not work right after the upload
        continue-on-error: true
        env:
          YOUTUBE_TOKENS_JSON: ${{ secrets.YOUTUBE_TOKENS_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python engine/daily.py comments
      - name: Top up the reserve scripts (housekeeping, never fails the run)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }} # optional free backup LLM
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # optional paid last resort
        run: python engine/reserve.py fill --target 8 --max-new 2
      - name: Write the heartbeat for the Telegram worker
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLAN_COUNT: ${{ needs.plan.outputs.count }}
          PLAN_RESULT: ${{ needs.plan.result }}
          PRODUCE_RESULT: ${{ needs.produce.result }}
        run: python engine/daily.py heartbeat
      - name: Commit the history and reserve (this also keeps the repository 'active' so GitHub never disables the schedule)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "chore: record published shorts [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1

  notify:
    needs: [plan, produce, record]
    if: always() && (needs.plan.outputs.count != '' && needs.plan.outputs.count != '0' || needs.plan.outputs.errors != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pydantic pydantic-settings typer anthropic httpx tzdata
      - name: Summary to Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PLAN_COUNT: ${{ needs.plan.outputs.count }}
          PLAN_ERRORS: ${{ needs.plan.outputs.errors }}
          PLAN_RESULT: ${{ needs.plan.result }}
          PRODUCE_RESULT: ${{ needs.produce.result }}
          RECORD_RESULT: ${{ needs.record.result }}
        run: python engine/telegram_bot.py notify-run

  alert:
    needs: [plan, produce, record]
    if: always() && (contains(needs.*.result, 'failure') || needs.plan.outputs.errors != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open an issue (GitHub e-mails you about it)
        uses: actions/github-script@v7
        env:
          PLAN_ERRORS: ${{ needs.plan.outputs.errors }}
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const errors = process.env.PLAN_ERRORS ? `\n\nPlanning errors: ${process.env.PLAN_ERRORS}` : "";
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Autopilot problem ${new Date().toISOString().slice(0, 10)}`,
              body: `Something failed in the daily Shorts run: ${run}${errors}`,
            });
