name: Telegram bot

# Answers the commands you send to the bot (/status /queue /stats /health /help).
# GitHub has no always-on server, so this checks for new messages every 5 minutes (replies can take a few
# minutes; GitHub sometimes delays scheduled runs). The daily autopilot sends its own notifications instantly.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install pydantic pydantic-settings typer httpx tzdata anthropic google-api-python-client google-auth google-auth-oauthlib
      - name: Answer waiting messages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_TOKENS_JSON: ${{ secrets.YOUTUBE_TOKENS_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python engine/telegram_bot.py poll
