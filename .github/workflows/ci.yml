name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Telegram worker tests
        run: node worker/test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache the voice models (Kokoro ~350 MB, Whisper ~150 MB)
        uses: actions/cache@v4
        with:
          path: |
            models/kokoro
            ~/.cache/huggingface
          key: voice-models-kokoro-v1.0-whisper-base.en
      - name: Tests (includes a real Kokoro speech synthesis on Linux)
        env:
          RUN_LIVE_TTS: "1"
        run: python -m pytest -q
